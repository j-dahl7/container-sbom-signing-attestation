# =============================================================================
# Supply Chain Security Pipeline
# =============================================================================
# This workflow demonstrates a complete supply chain security pipeline:
#
# 1. Build       - Multi-stage hardened container image
# 2. Scan        - Vulnerability scanning with Trivy
# 3. SBOM        - Software Bill of Materials with Syft
# 4. Sign        - Keyless signing with Cosign/Sigstore
# 5. Attest      - Build provenance attestation (SLSA)
# 6. Push        - Publish to GHCR with all attestations
#
# Zero Secrets Required! Uses OIDC for keyless operations.
# =============================================================================

name: Supply Chain Security

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Pull requests are intentionally validated without OIDC, package, attestation,
  # security-event, or cache-write permissions. Release credentials never share
  # a job with pull-request-controlled code.
  validate:
    name: Validate Pull Request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Test Go application
        working-directory: app
        run: |
          go test ./...
          go vet ./...

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: true
          skip-files: 'go.sum'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build pull request image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: supply-chain-demo:pr-validation
          provenance: false
          sbom: false

      - name: Scan pull request image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: supply-chain-demo:pr-validation
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  reject-untrusted-dispatch:
    name: Reject Untrusted Release Ref
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main or a version tag
        run: |
          echo "Release dispatches are allowed only from refs/heads/main or refs/tags/v*."
          exit 1

  # ===========================================================================
  # Build and Push Container Image
  # ===========================================================================
  build:
    name: Build, Scan, Sign & Attest
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write      # Required for OIDC (keyless signing)
      attestations: write  # Required for GitHub attestations
      security-events: write  # Required for Trivy SARIF upload

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.tags }}

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Test Go application
        working-directory: app
        run: |
          go test ./...
          go vet ./...

      - name: Set build metadata
        id: vars
        run: |
          {
            echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "git_commit=${GITHUB_SHA::8}"
            echo "version=${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Install Security Tools
      # -----------------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          hide-progress: true
          skip-files: 'go.sum'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # -----------------------------------------------------------------------
      # Build Container Image
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
            GIT_COMMIT=${{ steps.vars.outputs.git_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # -----------------------------------------------------------------------
      # Security Scanning (Trivy)
      # -----------------------------------------------------------------------
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Scan and fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      # -----------------------------------------------------------------------
      # Generate SBOM (Software Bill of Materials)
      # -----------------------------------------------------------------------
      - name: Generate SBOM with Syft
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            --output spdx-json=sbom.spdx.json \
            --output cyclonedx-json=sbom.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json

      # -----------------------------------------------------------------------
      # Sign Image with Cosign (Keyless via Sigstore)
      # -----------------------------------------------------------------------
      - name: Sign container image (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # -----------------------------------------------------------------------
      # GitHub Native Attestations (SLSA Provenance)
      # -----------------------------------------------------------------------
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Generate summary
        run: |
          {
            echo "## Supply Chain Security Summary"
            echo ""
            echo "### Image"
            echo "- **Registry:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "- **Tags:** ${{ steps.meta.outputs.tags }}"
            echo ""
            echo "### Security Artifacts"
            echo "| Artifact | Status |"
            echo "|----------|--------|"
            echo "| Vulnerability Scan | Trivy |"
            echo "| SBOM (SPDX) | Generated |"
            echo "| SBOM (CycloneDX) | Generated |"
            echo "| Cosign Signature | Keyless (Sigstore) |"
            echo "| SBOM Attestation | Attached |"
            echo "| Build Provenance | GitHub Attestations |"
            echo ""
            echo "### Verify Commands"
            echo "\`\`\`bash"
            echo "# Verify signature"
            echo "cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \\"
            echo "  --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com'"
            echo ""
            echo "# View SBOM attestation"
            echo "cosign verify-attestation ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \\"
            echo "  --type spdxjson \\"
            echo "  --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}' \\"
            echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com'"
            echo ""
            echo "# Verify GitHub build provenance"
            echo "gh attestation verify 'oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}' \\"
            echo "  --repo '${{ github.repository }}' \\"
            echo "  --cert-identity 'https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}' \\"
            echo "  --predicate-type 'https://slsa.dev/provenance/v1'"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Verify (Consumer Perspective)
  # ===========================================================================
  verify:
    name: Verify Supply Chain
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify image signature
        run: |
          echo "Verifying image signature..."
          cosign verify \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }} \
            --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'
          echo "Signature verified!"

      - name: Verify SBOM attestation
        run: |
          cosign verify-attestation \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }} \
            --type spdxjson \
            --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}' \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com'

      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}" \
            --repo "${{ github.repository }}" \
            --cert-identity "https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yml@${{ github.ref }}" \
            --predicate-type "https://slsa.dev/provenance/v1"

      - name: List attestations
        run: |
          echo "Listing image attestations..."
          cosign tree ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }} || true
          echo "Done!"
